<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>쇼핑 리스트</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.8;
            font-size: 14px;
        }

        .input-section {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        #itemInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #itemInput:focus {
            outline: none;
            border-color: #667eea;
        }

        #addBtn {
            padding: 15px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #addBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        #addBtn:active {
            transform: translateY(0);
        }

        .list-section {
            padding: 20px;
            min-height: 300px;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 60px 20px;
        }

        .empty-message span {
            font-size: 60px;
            display: block;
            margin-bottom: 15px;
        }

        #shoppingList {
            list-style: none;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .list-item:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .list-item.checked {
            background: #e8f5e9;
        }

        .list-item.checked .item-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #667eea;
            border-radius: 50%;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .checkbox:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .list-item.checked .checkbox {
            background: #4caf50;
            border-color: #4caf50;
        }

        .checkbox::after {
            content: '';
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .list-item.checked .checkbox::after {
            opacity: 1;
        }

        .item-text {
            flex: 1;
            font-size: 16px;
            color: #333;
        }

        .delete-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: #ff5252;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            opacity: 0;
        }

        .list-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            background: #ff1744;
            transform: scale(1.1);
        }

        .stats {
            padding: 15px 20px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
        }

        .clear-completed {
            background: none;
            border: none;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
        }

        .clear-completed:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>쇼핑 리스트</h1>
            <p>오늘 필요한 것들을 추가하세요</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="itemInput" placeholder="아이템을 입력하세요..." autofocus>
                <button id="addBtn">추가</button>
            </div>
        </div>

        <div class="list-section">
            <ul id="shoppingList"></ul>
            <div class="empty-message" id="emptyMessage">
                <span>🛒</span>
                <p>리스트가 비어있습니다.<br>아이템을 추가해 보세요!</p>
            </div>
        </div>

        <div class="stats" id="stats" style="display: none;">
            <span id="itemCount">0개 아이템</span>
            <button class="clear-completed" id="clearCompleted">완료된 항목 삭제</button>
        </div>
    </div>

    <script>
        // Supabase 설정
        const SUPABASE_URL = 'https://wlumfiprqvwklnvwljqv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndsdW1maXBycXZ3a2xudndsanF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3OTExNzEsImV4cCI6MjA4NDM2NzE3MX0.RFvhaQGqGT4Hz5fWVXyBCqOvkeYW6i0T-9NAr4h-pu4';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const itemInput = document.getElementById('itemInput');
        const addBtn = document.getElementById('addBtn');
        const shoppingList = document.getElementById('shoppingList');
        const emptyMessage = document.getElementById('emptyMessage');
        const stats = document.getElementById('stats');
        const itemCount = document.getElementById('itemCount');
        const clearCompleted = document.getElementById('clearCompleted');

        let items = [];

        // 데이터베이스에서 아이템 불러오기
        async function loadItems() {
            const { data, error } = await supabase
                .from('shopping_items')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error('데이터 로드 오류:', error);
                return;
            }

            items = data || [];
            renderList();
        }

        function renderList() {
            shoppingList.innerHTML = '';

            if (items.length === 0) {
                emptyMessage.style.display = 'block';
                stats.style.display = 'none';
            } else {
                emptyMessage.style.display = 'none';
                stats.style.display = 'flex';

                items.forEach((item) => {
                    const li = document.createElement('li');
                    li.className = `list-item ${item.checked ? 'checked' : ''}`;
                    li.innerHTML = `
                        <div class="checkbox" onclick="toggleItem(${item.id})"></div>
                        <span class="item-text">${escapeHtml(item.text)}</span>
                        <button class="delete-btn" onclick="deleteItem(${item.id})">×</button>
                    `;
                    shoppingList.appendChild(li);
                });

                const total = items.length;
                const completed = items.filter(item => item.checked).length;
                itemCount.textContent = `${completed}/${total}개 완료`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function addItem() {
            const text = itemInput.value.trim();
            if (text === '') return;

            const { data, error } = await supabase
                .from('shopping_items')
                .insert([{ text, checked: false }])
                .select();

            if (error) {
                console.error('아이템 추가 오류:', error);
                return;
            }

            items.push(data[0]);
            renderList();
            itemInput.value = '';
            itemInput.focus();
        }

        async function deleteItem(id) {
            const { error } = await supabase
                .from('shopping_items')
                .delete()
                .eq('id', id);

            if (error) {
                console.error('아이템 삭제 오류:', error);
                return;
            }

            items = items.filter(item => item.id !== id);
            renderList();
        }

        async function toggleItem(id) {
            const item = items.find(item => item.id === id);
            if (!item) return;

            const newChecked = !item.checked;

            const { error } = await supabase
                .from('shopping_items')
                .update({ checked: newChecked })
                .eq('id', id);

            if (error) {
                console.error('아이템 업데이트 오류:', error);
                return;
            }

            item.checked = newChecked;
            renderList();
        }

        async function clearCompletedItems() {
            const completedIds = items.filter(item => item.checked).map(item => item.id);

            if (completedIds.length === 0) return;

            const { error } = await supabase
                .from('shopping_items')
                .delete()
                .in('id', completedIds);

            if (error) {
                console.error('완료된 항목 삭제 오류:', error);
                return;
            }

            items = items.filter(item => !item.checked);
            renderList();
        }

        addBtn.addEventListener('click', addItem);

        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addItem();
            }
        });

        clearCompleted.addEventListener('click', clearCompletedItems);

        // 페이지 로드 시 데이터 불러오기
        loadItems();
    </script>
</body>
</html>
